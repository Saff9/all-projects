<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e1e1e" />
  <meta name="description" content="NexTerm AI — Professional AI Terminal" />
  
  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src *; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">

  <!-- Pre-initialize theme BEFORE any DOM rendering to prevent white screen -->
  <script>
    try {
      const settings = JSON.parse(localStorage.getItem('nexterm:app_settings') || '{}');
      document.documentElement.setAttribute('data-theme', settings.theme || 'macos_dark');
      document.documentElement.setAttribute('data-font', settings.font || 'fira');
    } catch(e) {
      document.documentElement.setAttribute('data-theme', 'macos_dark');
    }
  </script>

  <title>NexTerm AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Outfit:wght30..80&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="app">
    <!-- Boot screen -->
    <div id="boot-screen" class="boot-screen">
      <div class="boot-content">
        <div class="boot-icon">▲</div>
        <div class="boot-title">NexTerm AI</div>
        <div class="boot-bar">
          <div class="boot-bar-fill"></div>
        </div>
        <div class="boot-status">Initializing…</div>
      </div>
    </div>

    <!-- Main terminal window -->
    <div id="terminal-window" class="terminal-window hidden">
      <!-- macOS Titlebar -->
      <div class="titlebar" id="titlebar">
        <div class="titlebar-left">
          <div class="traffic-lights">
            <span class="tl-dot tl-close" title="Close"></span>
            <span class="tl-dot tl-minimize" title="Minimize"></span>
            <span class="tl-dot tl-maximize" title="Maximize"></span>
          </div>
        </div>
        <div class="titlebar-center">
          <div class="brand-title">
            <span class="app-name">NexTerm AI</span>
            <span class="dev-name">by <strong>Saffan</strong></span>
          </div>
        </div>
        <div class="titlebar-right">
          <button id="btn-memory" class="tb-btn" title="Memory">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
          </button>
          <button id="btn-skills" class="tb-btn" title="Skills">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" />
            </svg>
          </button>
          <button id="btn-settings" class="tb-btn" title="Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <div class="tab active" id="tab-main">
          <span class="tab-icon">●</span>
          <span class="tab-label" id="tab-label">Session 1</span>
        </div>
        <div class="tab-badges">
          <span id="provider-badge" class="badge badge-provider">NO PROVIDER</span>
          <span id="model-badge" class="badge badge-model"></span>
        </div>
      </div>

      <!-- Terminal output -->
      <div id="terminal-output" class="terminal-output">
        <div id="output-container"></div>
      </div>

      <!-- Input area -->
      <div id="file-preview" class="file-preview hidden"></div>
      <div class="input-area">
        <label for="file-upload" class="btn-upload" title="Upload File">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
          </svg>
        </label>
        <input type="file" id="file-upload" class="hidden" multiple accept="text/*,image/*,.pdf,.doc,.docx" />
        <span class="prompt-char">$</span>
        <textarea id="terminal-input" class="terminal-input" rows="1"
          placeholder="Type a message or /help for commands…" autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false"></textarea>
        <button id="btn-send" class="btn-send" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>

      <!-- Status bar -->
      <div class="status-bar">
        <div class="status-left">
          <span class="status-item" id="status-connection">
            <span class="status-dot offline"></span>
            <span>Disconnected</span>
          </span>
        </div>
        <div class="status-right">
          <span class="status-item" id="status-memory">0 messages</span>
          <span class="status-sep">·</span>
          <span class="status-item" id="status-skills">0 skills</span>
        </div>
      </div>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel" class="panel-overlay hidden">
      <div class="panel-backdrop"></div>
      <div class="panel-sheet">
        <div class="panel-header">
          <h2>Settings</h2>
          <button id="btn-close-settings" class="panel-close">✕</button>
        </div>
        <div class="panel-body" id="settings-body"></div>
      </div>
    </div>

    <!-- Skills panel -->
    <div id="skills-panel" class="panel-overlay hidden">
      <div class="panel-backdrop"></div>
      <div class="panel-sheet">
        <div class="panel-header">
          <h2>Skills</h2>
          <button id="btn-close-skills" class="panel-close">✕</button>
        </div>
        <div class="panel-body" id="skills-body"></div>
      </div>
    </div>

    <!-- Memory panel -->
    <div id="memory-panel" class="panel-overlay hidden">
      <div class="panel-backdrop"></div>
      <div class="panel-sheet">
        <div class="panel-header">
          <h2>Memory</h2>
          <button id="btn-close-memory" class="panel-close">✕</button>
        </div>
        <div class="panel-body" id="memory-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
