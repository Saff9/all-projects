name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: doclite-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: doclite-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            artifact_name: doclite-macos-x86_64
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release

      - name: Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/doclite
          Copy-Item target/release/doclite.exe dist/doclite/
          Copy-Item target/release/doclite.dll dist/doclite/
          Copy-Item include/doclite.h dist/doclite/
          Copy-Item python/doclite.py dist/doclite/
          Copy-Item README.md dist/doclite/
          Copy-Item LICENSE-MIT dist/doclite/
          Compress-Archive -Path dist/doclite/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/doclite
          cp target/release/doclite dist/doclite/
          cp target/release/libdoclite.* dist/doclite/ || true
          cp include/doclite.h dist/doclite/
          cp python/doclite.py dist/doclite/
          cp README.md dist/doclite/
          cp LICENSE-MIT dist/doclite/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist/doclite .

      - name: Upload Package to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
