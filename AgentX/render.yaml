# render.yaml – AgentX single-service deploy (Python backend serves frontend)

services:
  - type: web
    name: agentx
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: DB_PATH
        value: /opt/render/project/src/data/agentx.db
      - key: WORKSPACE_DIR
        value: /opt/render/project/src/workspace
      # ── Add at least ONE LLM key in Render dashboard ──────────────────
      - key: GROQ_API_KEY
        sync: false     # FREE → get at console.groq.com
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
    disk:
      name: agentx-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
